<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekend Escape — Your Next Weekend Adventure Starts Here</title>
  <meta name="description" content="Discover beautiful destinations, hidden gems, and unforgettable 2-3 day weekend escapes." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #FAF8F5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* ---- Hero cave/waterfall scene ---- */
    @keyframes driftBack {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-40px); }
    }
    @keyframes driftFront {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-70px); }
    }
    @keyframes flowDown {
      0%   { transform: translateY(-40%); }
      100% { transform: translateY(40%); }
    }
    @keyframes shimmerHole {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.85; }
    }
    @keyframes mist {
      0%   { opacity: 0; transform: translateY(6px) scale(0.9); }
      40%  { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-22px) scale(1.15); }
    }
    @keyframes ripple {
      0%   { opacity: 0.5; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.6); }
    }
    @keyframes portalFlash {
      0%   { opacity: 0; }
      35%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .layer-back   { animation: driftBack 26s ease-in-out infinite alternate; }
    .layer-front  { animation: driftFront 18s ease-in-out infinite alternate; }
    .hole-glow    { animation: shimmerHole 4.5s ease-in-out infinite; }
    .water-strip  { animation: flowDown 1.4s linear infinite; }
    .mist-puff    { animation: mist 3.6s ease-out infinite; }
    .ripple-ring  { animation: ripple 2.4s ease-out infinite; }
    .portal-flash { animation: portalFlash 900ms ease-out forwards; }

    .cave-parted .water-curtain-left  { transform: translateX(-46px); opacity: 0.25; }
    .cave-parted .water-curtain-right { transform: translateX(46px);  opacity: 0.25; }
    .cave-parted .hole-core           { transform: scale(1.18); }
    .water-curtain-left, .water-curtain-right, .hole-core {
      transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1), opacity 900ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .layer-back, .layer-front, .hole-glow, .water-strip, .mist-puff, .ripple-ring {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="text-stone-900 antialiased selection:bg-emerald-200 selection:text-emerald-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // --- Mock Data ---
    const destinations = [
      {

      {
        id: 'pondicherry',
        name: 'Pondicherry',
        location: 'Puducherry, India',
        category: 'Beach',
        description: 'French quarter charm, pastel streets, and serene promenade sunsets.',
        detailedDescription: 'A picturesque coastal getaway merging French colonial architecture with coastal Indian charm. Cycle past mustard-yellow villas in White Town, discover tranquil beaches, savor French patisseries, and watch glowing sunrises over the Bay of Bengal.',

    const CATEGORIES = ['All', 'Beach', 'Mountain', 'Nature', 'City'];

    // --- Header ---
    function Header({ onExploreClick, selectedCount }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const scrollTo = (id) => {
        setMobileMenuOpen(false);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <header className="absolute top-0 left-0 right-0 z-40 w-full bg-transparent text-white transition-colors">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-18">
              <a href="#top" className="flex items-center gap-2.5 group focus:outline-none" aria-label="Weekend Escape - Home">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-600/20 group-hover:scale-105 transition-transform">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
                  </svg>
                </div>
                <div className="flex flex-col">
                  <span className="font-bold text-xl tracking-tight text-white group-hover:text-emerald-100 transition-colors">

              </a>

              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-white/90">

                  Home
                </button>
                <button type="button" onClick={() => scrollTo('destinations')} className="hover:text-white transition-colors cursor-pointer">
                  Destinations
                </button>
                <button type="button" onClick={() => scrollTo('about')} className="hover:text-white transition-colors cursor-pointer">
                  About
                </button>
              </nav>

              <div className="hidden md:flex items-center gap-4">
                {selectedCount > 0 && (
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    1 Escape Chosen
                  </span>
                )}
                <button
                  type="button"
                  onClick={onExploreClick}
                  className="px-5 py-2.5 rounded-full text-sm font-semibold text-stone-900 bg-white hover:bg-emerald-100 transition-all duration-200 shadow-sm cursor-pointer"
                >
                  Explore Destinations
                </button>
              </div>

              <div className="md:hidden flex items-center">
                <button
                  type="button"
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  aria-label="Toggle navigation menu"
                  className="p-2 rounded-lg text-white hover:bg-white/15"
                >
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />

                </button>
              </div>
            </div>
          </div>

          {mobileMenuOpen && (
            <div className="md:hidden border-t border-white/20 bg-stone-950/90 backdrop-blur-md px-4 pt-3 pb-6 space-y-3 shadow-lg">
              <nav className="flex flex-col space-y-2 text-base font-medium text-white/90">
                <button type="button" onClick={() => scrollTo('top')} className="text-left px-3 py-2 rounded-md hover:bg-white/10">
                  Home

                <button type="button" onClick={() => scrollTo('destinations')} className="text-left px-3 py-2 rounded-md hover:bg-white/10">

    // --- CaveScene: animated mountain range with a waterfall-veiled cave ---
    // Click/tap the falls to part the water, brighten the cave, and reveal
    // the destinations below — a single deliberate "open the details" moment.
    function CaveScene({ onEnter }) {
      const [parted, setParted] = useState(false);
      const [flash, setFlash] = useState(false);
      const timeoutsRef = useRef([]);

      useEffect(() => () => timeoutsRef.current.forEach(clearTimeout), []);

      const handleEnter = () => {
        if (parted) return;
        setParted(true);
        const t1 = setTimeout(() => setFlash(true), 550);
        const t2 = setTimeout(() => { onEnter(); }, 720);
        const t3 = setTimeout(() => { setParted(false); setFlash(false); }, 2200);
        timeoutsRef.current.push(t1, t2, t3);
      };

      return (
        <div className="absolute inset-0 overflow-hidden bg-stone-950" aria-hidden="false">
          <svg
            className="absolute inset-0 w-full h-full"
            viewBox="0 0 1600 900"
            preserveAspectRatio="xMidYMax slice"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#0b1f22" />
                <stop offset="55%" stopColor="#0f2e2a" />
                <stop offset="100%" stopColor="#123a34" />
              </linearGradient>
              <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#1b3d3a" />
                <stop offset="100%" stopColor="#123028" />
              </linearGradient>
              <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#0e2622" />
                <stop offset="100%" stopColor="#081815" />
              </linearGradient>
              <radialGradient id="holeGlow" cx="50%" cy="45%" r="60%">
                <stop offset="0%" stopColor="#eafff4" stopOpacity="0.95" />
                <stop offset="45%" stopColor="#8fe3c8" stopOpacity="0.55" />
                <stop offset="100%" stopColor="#0b2420" stopOpacity="0" />
              </radialGradient>
              <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#e7fbff" />
                <stop offset="100%" stopColor="#7fd6e6" />
              </linearGradient>
              <radialGradient id="flashGrad" cx="50%" cy="46%" r="55%">
                <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
                <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
              </radialGradient>
            </defs>

            {/* sky */}
            <rect x="0" y="0" width="1600" height="900" fill="url(#sky)" />

            {/* distant range, drifts slowly */}
            <g className="layer-back">
              <path
                d="M-50,560 L120,430 L260,520 L400,380 L560,500 L720,360 L900,510 L1080,400 L1250,520 L1420,410 L1650,540 L1650,900 L-50,900 Z"
                fill="url(#mtnBack)"
                opacity="0.75"
              />
            </g>

            {/* front range with the cave mouth cut into it */}
            <g className="layer-front">
              <path
                d="M-50,650 L160,470 L300,560 Q420,610 470,520 Q560,460 660,540 Q720,600 800,560 L900,470 L1060,580 L1220,480 L1400,580 L1650,470 L1650,900 L-50,900 Z"
                fill="url(#mtnFront)"
              />
              {/* cave glow, sits inside the front mountain's arch */}
              <g className="hole-core">
                <ellipse cx="620" cy="565" rx="120" ry="150" fill="url(#holeGlow)" />
                <ellipse className="hole-glow" cx="620" cy="575" rx="86" ry="112" fill="#e9fff6" opacity="0.4" />
              </g>
              {/* rim shadow so the arch reads as an opening, not a sticker */}
              <path
                d="M500,700 Q520,520 620,470 Q720,520 742,700 Z"
                fill="none"
                stroke="#04110e"
                strokeWidth="14"
                opacity="0.55"
              />
            </g>

            {/* rising mist at the base of the falls */}
            <g fill="#eafffa" opacity="0.5">
              <ellipse className="mist-puff" cx="585" cy="700" rx="26" ry="12" style={{ animationDelay: '0s' }} />
              <ellipse className="mist-puff" cx="625" cy="708" rx="20" ry="10" style={{ animationDelay: '1.1s' }} />
              <ellipse className="mist-puff" cx="655" cy="700" rx="24" ry="11" style={{ animationDelay: '2s' }} />
            </g>

            {/* ripples where the water lands */}
            <g fill="none" stroke="#bff2e6">
              <ellipse className="ripple-ring" cx="618" cy="705" rx="40" ry="12" strokeWidth="2" style={{ animationDelay: '0s' }} />
              <ellipse className="ripple-ring" cx="618" cy="705" rx="40" ry="12" strokeWidth="2" style={{ animationDelay: '1.2s' }} />
            </g>

            {/* flash on entry */}
            {flash && <rect x="0" y="0" width="1600" height="900" fill="url(#flashGrad)" className="portal-flash" />}
          </svg>

          {/* the water curtain — a real HTML overlay so it can "part" with a smooth transform */}
          <div
            className={`absolute ${parted ? 'cave-parted' : ''}`}
            style={{ left: '34.5%', top: '50.5%', width: '9.2%', height: '27%' }}
          >
            <div className="relative w-full h-full overflow-hidden rounded-b-full">
              <div className="water-curtain-left absolute inset-y-0 left-0 w-1/2 overflow-hidden">
                <div
                  className="water-strip absolute inset-x-0"
                  style={{
                    top: '-40%', height: '180%',
                    background: 'repeating-linear-gradient(180deg, rgba(255,255,255,0.9) 0px, rgba(191,242,230,0.55) 6px, rgba(127,214,230,0.85) 14px)',
                  }}
                />
              </div>
              <div className="water-curtain-right absolute inset-y-0 right-0 w-1/2 overflow-hidden">
                <div
                  className="water-strip absolute inset-x-0"
                  style={{
                    top: '-40%', height: '180%',
                    background: 'repeating-linear-gradient(180deg, rgba(255,255,255,0.85) 0px, rgba(191,242,230,0.5) 7px, rgba(127,214,230,0.8) 15px)',
                    animationDuration: '1.7s',
                  }}
                />
              </div>
            </div>
          </div>

          <button
            type="button"
            onClick={handleEnter}
            aria-label="Part the falls and enter — reveals the destinations below"
            className="absolute cursor-pointer group"
            style={{ left: '30%', top: '46%', width: '17%', height: '38%' }}
          >
            <span className="sr-only">Enter the falls</span>
          </button>

          <div
            className="absolute pointer-events-none text-center text-[11px] sm:text-xs font-semibold uppercase tracking-widest text-emerald-100/80"
            style={{ left: '50%', top: '89%', transform: 'translateX(-50%)' }}
          >
            Tap the falls to step inside
          </div>
        </div>
      );
    }

    // --- Hero ---
    function Hero({ onExploreClick }) {
      return (
        <section
          className="relative flex min-h-[85vh] items-center overflow-hidden bg-stone-950 pt-28 pb-16 md:min-h-screen md:pt-32 md:pb-24"
        >
          <CaveScene onEnter={onExploreClick} />
          <div className="absolute inset-0 bg-gradient-to-r from-stone-950/80 via-stone-950/40 to-transparent" />
          <div className="absolute inset-0 bg-gradient-to-t from-stone-950/70 via-transparent to-stone-950/10" />
          <div className="relative z-10 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8">
            <div className="max-w-3xl">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 text-white border border-white/25 backdrop-blur-md text-xs font-semibold uppercase tracking-wider mb-6">
                <span className="flex h-2 w-2 rounded-full bg-emerald-300 animate-ping" />
                <span>Discover · Explore · Reconnect</span>
              </div>
              <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold text-white tracking-tight leading-[1.05] mb-6">
                Your next weekend <span className="text-emerald-200">adventure starts here.</span>
              </h1>
              <p className="text-lg sm:text-xl text-stone-100/90 leading-relaxed max-w-2xl mb-8">
                Discover beautiful destinations, hidden gems, and unforgettable experiences perfect for a short escape.
              </p>
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 w-full sm:w-auto mb-12">
                <button type="button" onClick={onExploreClick} className="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full text-base font-bold text-stone-900 bg-white hover:bg-emerald-100 transition-all duration-200 shadow-lg cursor-pointer">
                  <span>Explore destinations</span>
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                </button>
                <a href="#about" className="inline-flex items-center justify-center px-6 py-4 rounded-full text-base font-semibold text-white hover:bg-white/10 transition-colors">How it works ↓</a>
              </div>
              <div className="grid grid-cols-3 gap-4 sm:gap-8 pt-8 border-t border-white/30 w-full max-w-xl">
                <div><div className="text-2xl sm:text-3xl font-extrabold text-white">50+</div><div className="text-xs sm:text-sm font-medium text-stone-200 mt-0.5">Destinations</div></div>
                <div><div className="text-2xl sm:text-3xl font-extrabold text-white">2–3 Days</div><div className="text-xs sm:text-sm font-medium text-stone-200 mt-0.5">Quick Getaways</div></div>
                <div><div className="text-2xl sm:text-3xl font-extrabold text-white">100%</div><div className="text-xs sm:text-sm font-medium text-stone-200 mt-0.5">Curated for you</div></div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- FilterBar ---
    function FilterBar({ categories, activeCategory, onSelectCategory, categoryCounts }) {
      return (
        <div className="w-full flex flex-col items-center mb-10 text-center">
          <span className="text-xs font-bold uppercase tracking-widest text-emerald-800 bg-emerald-100/70 px-3 py-1 rounded-full mb-3">
            Curated Escapes
          </span>
          <h2 id="destinations-heading" className="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight mb-3">
            Perfect weekend escapes
          </h2>
          <p className="text-base sm:text-lg text-stone-700 max-w-xl mb-8">
            Choose a destination that matches your mood.
          </p>

          <div role="group" aria-label="Filter destinations" className="inline-flex flex-wrap items-center justify-center p-1.5 rounded-2xl bg-stone-100 border border-stone-200 gap-1">
            {categories.map((category) => {
              const isSelected = activeCategory === category;
              const count = categoryCounts[category] || 0;
              return (
                <button
                  key={category}
                  type="button"
                  onClick={() => onSelectCategory(category)}
                  aria-pressed={isSelected}
                  className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all cursor-pointer ${
                    isSelected
                      ? 'bg-white text-emerald-800 shadow-md font-bold'
                      : 'text-stone-700 hover:text-stone-900 hover:bg-white/60'
                  }`}
                >
                  <span>{category}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ${isSelected ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-200 text-stone-700'}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // --- DestinationCard ---
    function DestinationCard({ destination, isSelected, onExplore }) {
      const categoryColors = {
        Beach: 'bg-cyan-50 text-cyan-800 border-cyan-200/80',
        Mountain: 'bg-emerald-50 text-emerald-800 border-emerald-200/80',
        Nature: 'bg-amber-50 text-amber-900 border-amber-200/80',
        City: 'bg-purple-50 text-purple-800 border-purple-200/80',
      };
      const badgeClass = categoryColors[destination.category] || 'bg-stone-50 text-stone-700 border-stone-200';

      return (
        <article className={`group relative flex flex-col bg-white rounded-3xl overflow-hidden border transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl ${
          isSelected ? 'border-emerald-600 ring-2 ring-emerald-600/30 shadow-md' : 'border-stone-200 shadow-sm'
        }`}>
          <div className="relative w-full aspect-[4/3] bg-stone-100 overflow-hidden">
            <img
              src={destination.image}
              alt={`${destination.name}, ${destination.location}`}
              loading="lazy"
              className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
            />
            <div className="absolute top-3.5 left-3.5">
              <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border backdrop-blur-md ${badgeClass}`}>
                {destination.category}
              </span>
            </div>
            {isSelected && (
              <div className="absolute top-3.5 right-3.5">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-md">
                  ✓ Selected
                </span>
              </div>
            )}
            <div className="absolute bottom-3 right-3.5">
              <div className="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white/95 backdrop-blur-md shadow-md text-xs font-bold text-stone-900">
                <span className="text-amber-500">★</span>
                <span>{destination.rating.toFixed(1)}</span>
                <span className="text-stone-700 font-normal">({destination.reviewsCount})</span>
              </div>
            </div>
          </div>

          <div className="flex flex-col flex-1 p-6">
            <div className="mb-2">
              <h3 className="text-xl font-bold text-stone-900 group-hover:text-emerald-700 transition-colors">
                {destination.name}
              </h3>
              <p className="text-xs font-medium text-stone-600 mt-0.5">
                📍 {destination.location}
              </p>
            </div>

            <p className="text-sm text-stone-700 leading-relaxed line-clamp-2 mb-6">
              {destination.description}
            </p>

            <div className="mt-auto pt-4 border-t border-stone-100 flex items-center justify-between gap-3">
              <div>
                <div className="text-xs text-stone-600 font-medium">Est. per person</div>
                <div className="flex items-baseline gap-1.5">
                  <span className="text-xl font-extrabold text-stone-900">
                    ₹{destination.price.toLocaleString('en-IN')}
                  </span>
                  <span className="text-xs font-medium text-stone-600">• {destination.duration}</span>
                </div>
              </div>

              <button
                type="button"
                onClick={() => onExplore(destination)}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold text-emerald-800 bg-emerald-100/70 hover:bg-emerald-700 hover:text-white transition-all cursor-pointer"
              >
                <span>Explore</span>
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </div>
        </article>
      );
    }

    // --- DestinationModal ---
    function DestinationModal({ destination, isOpen, isSelected, onClose, onSelectDestination }) {
      const closeRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        const originalOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        closeRef.current?.focus();

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalOverflow;
        };
      }, [isOpen, onClose]);

      if (!isOpen || !destination) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto" role="presentation">
          <div className="fixed inset-0 bg-stone-950/70 backdrop-blur-sm transition-opacity" onClick={onClose} />

          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            className="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-stone-200 overflow-hidden z-10 my-8"
          >
            <button
              ref={closeRef}
              type="button"
              onClick={onClose}
              aria-label="Close destination details"
              className="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-white/90 hover:bg-white text-stone-700 shadow flex items-center justify-center cursor-pointer"
            >
              ✕
            </button>

            <div className="relative w-full aspect-[16/9] bg-stone-100 overflow-hidden">
              <img src={destination.image} alt={destination.name} className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent" />
              <div className="absolute bottom-4 left-6 right-6 text-white">
                <span className="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-bold uppercase tracking-wider mb-2">
                  {destination.category}
                </span>
                <h3 id="modal-title" className="text-2xl sm:text-3xl font-extrabold">{destination.name}</h3>
                <p className="text-sm text-stone-200 mt-0.5">📍 {destination.location}</p>
              </div>
            </div>

            <div className="p-6 sm:p-8 space-y-6 max-h-[calc(85vh-200px)] overflow-y-auto">
              <div className="grid grid-cols-3 gap-3 p-4 rounded-2xl bg-stone-50 border border-stone-200 text-center">
                <div>
                  <div className="text-xs text-stone-500 font-medium">Rating</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">★ {destination.rating.toFixed(1)}</div>
                </div>
                <div className="border-x border-stone-200">
                  <div className="text-xs text-stone-500 font-medium">Estimated Cost</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">₹{destination.price.toLocaleString('en-IN')}</div>
                </div>
                <div>
                  <div className="text-xs text-stone-500 font-medium">Duration</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">{destination.duration}</div>
                </div>
              </div>

              <div>
                <h4 className="text-sm font-bold uppercase tracking-wider text-stone-400 mb-2">About This Escape</h4>
                <p className="text-stone-700 leading-relaxed text-sm sm:text-base">{destination.detailedDescription}</p>
              </div>

              <div>
                <h4 className="text-sm font-bold uppercase tracking-wider text-stone-400 mb-3">Escape Highlights</h4>
                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  {destination.highlights.map((h, idx) => (
                    <li key={idx} className="flex items-center gap-2.5 text-sm font-medium text-stone-800 bg-emerald-50 border border-emerald-100 rounded-xl px-3.5 py-2">
                      <span className="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">✓</span>
                      <span>{h}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>

            <div className="p-6 bg-stone-50 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-xs text-stone-500 font-medium block">Starting from</span>
                <span className="text-2xl font-black text-stone-900">₹{destination.price.toLocaleString('en-IN')}</span>
                <span className="text-xs text-stone-500 ml-1">/ person all-inclusive est.</span>
              </div>
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <button type="button" onClick={onClose} className="px-5 py-3 rounded-xl text-sm font-semibold text-stone-700 hover:bg-stone-200 cursor-pointer">
                  Close
                </button>
                <button
                  type="button"
                  onClick={() => onSelectDestination(destination)}
                  className={`inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-bold text-white shadow-lg cursor-pointer ${
                    isSelected ? 'bg-emerald-800' : 'bg-emerald-600 hover:bg-emerald-700'
                  }`}
                >
                  <span>{isSelected ? '✓ Destination Chosen' : 'Choose this destination'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main Application ---
    function App() {
      const [activeCategory, setActiveCategory] = useState('All');
      const [selectedDestination, setSelectedDestination] = useState(null);
      const [modalDestination, setModalDestination] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const closeModal = useCallback(() => setIsModalOpen(false), []);

      const filteredDestinations = useMemo(() => {
        if (activeCategory === 'All') return destinations;
        return destinations.filter((d) => d.category === activeCategory);
      }, [activeCategory]);

      const categoryCounts = useMemo(() => {
        const counts = { All: destinations.length, Beach: 0, Mountain: 0, Nature: 0, City: 0 };
        destinations.forEach((d) => { if (counts[d.category] !== undefined) counts[d.category] += 1; });
        return counts;
      }, []);

      const handleExploreClick = () => {
        const sec = document.getElementById('destinations');
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF8F5]">
          <Header onExploreClick={handleExploreClick} selectedCount={selectedDestination ? 1 : 0} />

          <main id="top" className="flex-1">
            <Hero onExploreClick={handleExploreClick} />

            <section id="why-us" className="py-12 bg-white border-y border-stone-200">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                  <h3 className="font-bold text-base text-stone-900">⏱️ 2 to 3 Day Itineraries</h3>
                  <p className="text-sm text-stone-600 mt-1">Carefully planned trips tailored for quick weekend turnarounds.</p>
                </div>
                <div>
                  <h3 className="font-bold text-base text-stone-900">🌿 Curated & Tested</h3>
                  <p className="text-sm text-stone-600 mt-1">Verified homestays, authentic local food stops, and scenic trails.</p>
                </div>
                <div>
                  <h3 className="font-bold text-base text-stone-900">💰 Budget Friendly</h3>
                  <p className="text-sm text-stone-600 mt-1">Transparent cost estimates covering stay, local food, and activities.</p>
                </div>
              </div>
            </section>

            <section id="destinations" className="py-16 md:py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 scroll-mt-20">
              <FilterBar
                categories={CATEGORIES}
                activeCategory={activeCategory}
                onSelectCategory={setActiveCategory}
                categoryCounts={categoryCounts}
              />
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                {filteredDestinations.map((dest) => (
                  <DestinationCard
                    key={dest.id}
                    destination={dest}
                    isSelected={selectedDestination?.id === dest.id}
                    onExplore={(d) => { setModalDestination(d); setIsModalOpen(true); }}
                  />
                ))}
              </div>
            </section>

            <section id="about" className="py-20 bg-stone-100/70 border-t border-stone-200 text-center">
              <div className="max-w-4xl mx-auto px-4">
                <span className="text-xs font-bold uppercase tracking-widest text-emerald-800 bg-emerald-100 px-3.5 py-1 rounded-full mb-4 inline-block">
                  Our Philosophy
                </span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-stone-900 mb-4">Reclaim your weekend.</h2>
                <p className="text-base sm:text-lg text-stone-700 max-w-2xl mx-auto mb-6">
                  Great travel shouldn't require taking two weeks off. With Weekend Escape, your next adventure is just a quick drive or train ride away.
                </p>
              </div>
            </section>
          </main>

          <footer className="w-full bg-stone-900 text-stone-300 py-12 border-t border-stone-800 text-center">
            <p className="font-bold text-white text-lg">Weekend Escape</p>
            <p className="text-xs text-stone-400 mt-2">© {new Date().getFullYear()} Weekend Escape. All rights reserved.</p>
          </footer>

          <DestinationModal
            destination={modalDestination}
            isOpen={isModalOpen}
            isSelected={modalDestination?.id === selectedDestination?.id}
            onClose={closeModal}
            onSelectDestination={(d) => { setSelectedDestination(d); setIsModalOpen(false); }}
          />

          {selectedDestination && (
            <aside className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-lg">
              <div role="status" aria-live="polite" className="flex items-center justify-between gap-4 p-4 rounded-2xl bg-stone-900 text-white shadow-2xl border border-stone-800">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold">✓</div>
                  <div>
                    <div className="text-sm font-bold">✓ {selectedDestination.name} selected!</div>
                    <div className="text-xs text-stone-400">{selectedDestination.duration} escape in {selectedDestination.location}</div>
                  </div>
                </div>
                <button type="button" onClick={() => setSelectedDestination(null)} className="p-1 text-stone-400 hover:text-white cursor-pointer">✕</button>
              </div>
            </aside>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
