<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekend Escape — Your Next Weekend Adventure Starts Here</title>
  <meta name="description" content="Discover beautiful destinations, hidden gems, and unforgettable 2-3 day weekend escapes." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #FAF8F5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Cinematic Ken Burns Background Image Animation */
    @keyframes kenBurnsHero {
      0% {
        transform: scale(1) translate(0%, 0%);
      }
      50% {
        transform: scale(1.08) translate(-1.2%, -1%);
      }
      100% {
        transform: scale(1.03) translate(1%, 0.5%);
      }
    }

    .animate-hero-bg {
      animation: kenBurnsHero 24s ease-in-out infinite alternate;
      will-change: transform;
      transform-origin: center center;
    }

    .hero-ambient-glow {
      background: conic-gradient(from 90deg at 50% 50%, transparent, rgba(110, 231, 183, .16), transparent 28%, rgba(45, 212, 191, .13), transparent 58%);
      animation: ambientRotation 26s linear infinite;
      pointer-events: none;
    }

    @keyframes ambientRotation {
      to { transform: rotate(360deg); }
    }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: -4rem;
      z-index: 100;
      border-radius: .75rem;
      background: #022c22;
      color: white;
      padding: .75rem 1rem;
      font-weight: 700;
      transition: top .2s ease;
    }

    .skip-link:focus { top: 1rem; }

    /* Accessibility: Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .animate-hero-bg {
        animation: none !important;
        transform: scale(1.02) !important;
      }

      .hero-ambient-glow { animation: none !important; }
    }
  </style>
</head>
<body class="text-stone-900 antialiased selection:bg-emerald-200 selection:text-emerald-900">
  <a class="skip-link" href="#main-content">Skip to destinations</a>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // --- Mock Data: Exact 6 Destinations from Challenge Brief ---
    const destinations = [
      {
        id: 'munnar',

        price: 5500,

      {

        detailedDescription: 'Discover breezy palm-lined coastlines, colonial heritage, and vibrant seaside shacks. Whether unwinding on pristine white sands or enjoying sunset cruises, Goa delivers the quintessential coastal recharge.',
        image: 'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=1000&q=80',
        price: 8500,

      {

        detailedDescription: 'The vibrant Pink City offers a regal weekend journey through grand UNESCO hilltop forts, ornate palaces, colorful artisan markets, and world-renowned Rajasthani culinary traditions.',
        image: 'https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=1000&q=80',
        price: 7500,

        rating: 4.6,

      {
        id: 'coorg',

        description: 'Aromatic coffee estates, lush rainforests, and tranquil waterfalls.',
        detailedDescription: 'Widely dubbed the "Scotland of India", Coorg enchants weekenders with emerald coffee plantations, misty valleys, cascading Abbey Falls, and cozy plantation homestays surrounded by birdsong and fresh mountain air.',

      {
        id: 'pondicherry',

        location: 'Tamil Nadu, India',
        category: 'Beach',
        description: 'French quarter charm, pastel streets, and serene promenade sunsets.',
        detailedDescription: 'A picturesque coastal getaway merging French colonial architecture with coastal Indian charm. Cycle past mustard-yellow villas in White Town, discover tranquil beaches, savor French patisseries, and watch glowing sunrises over the Bay of Bengal.',
        image: 'https://images.unsplash.com/photo-1582510003544-4d00b7f74220?auto=format&fit=crop&w=1000&q=80',
        price: 5000,

      {
        id: 'ooty',
        name: 'Ooty',
        location: 'Tamil Nadu, India',
        category: 'Mountain',
        description: 'Chilly pine forests, heritage toy train, and panoramic valley lookouts.',
        detailedDescription: 'Perched 2,240 meters above sea level in the Nilgiri Hills, Ooty treats travelers to crisp highland breezes, pine forests, manicured rose gardens, and a nostalgic ride on the UNESCO-listed Nilgiri Mountain Railway.',
        image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80',
        price: 4500,
        duration: '2 Days',
        rating: 4.7,
        reviewsCount: 2110,
        highlights: ['Nilgiri Toy Train', 'Botanical Gardens', 'Valley Viewpoints'],
        bestTimeToVisit: 'All Year Round',
      },
    ];

    const CATEGORIES = ['All', 'Beach', 'Mountain', 'Nature', 'City'];

    // --- Header ---
    function Header({ onExploreClick, selectedCount }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const scrollTo = (id) => {
        setMobileMenuOpen(false);
        if (id === 'home' || id === 'top') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <header
          className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${
            scrolled
              ? 'bg-stone-950/85 backdrop-blur-md shadow-xl py-3.5 border-b border-white/10'
              : 'bg-gradient-to-b from-black/70 via-black/30 to-transparent py-5'
          }`}
        >
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between">
              {/* Brand */}
              <button
                type="button"
                onClick={() => scrollTo('top')}
                className="flex items-center gap-2.5 text-left focus:outline-none cursor-pointer group"
                aria-label="Weekend Escape - Home"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/30 group-hover:scale-105 transition-transform">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
                  </svg>
                </div>
                <div className="flex flex-col">
                  <span className="font-bold text-xl sm:text-2xl tracking-tight text-white group-hover:text-emerald-300 transition-colors leading-none">
                    Weekend Escape
                  </span>
                  <span className="text-[11px] font-medium text-stone-300 tracking-wider uppercase mt-0.5">
                    Curated Short Getaways
                  </span>
                </div>
              </button>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-stone-200">
                <button type="button" onClick={() => scrollTo('top')} className="hover:text-white transition-colors cursor-pointer py-1">
                  Home
                </button>
                <button type="button" onClick={() => scrollTo('destinations')} className="hover:text-white transition-colors cursor-pointer py-1">
                  Destinations
                </button>
                <button type="button" onClick={() => scrollTo('about')} className="hover:text-white transition-colors cursor-pointer py-1">
                  About
                </button>
              </nav>

              {/* Action Button */}
              <div className="hidden md:flex items-center gap-4">
                {selectedCount > 0 && (
                  <span className="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 backdrop-blur-md">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    1 Selected
                  </span>
                )}
                <button
                  type="button"
                  onClick={onExploreClick}
                  className="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-full text-sm font-bold text-stone-950 bg-white hover:bg-emerald-300 hover:text-stone-950 transition-all duration-200 shadow-md cursor-pointer active:scale-95"
                >
                  <span>Explore →</span>
                </button>
              </div>

              {/* Mobile Hamburger Toggle */}
              <div className="md:hidden flex items-center">
                <button
                  type="button"
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  aria-label="Toggle navigation menu"
                  className="p-2 rounded-xl text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-400"
                >
                  {mobileMenuOpen ? (
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  ) : (
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                  )}
                </button>
              </div>
            </div>
          </div>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="md:hidden mt-3 mx-4 rounded-2xl bg-stone-950/95 backdrop-blur-xl border border-white/15 p-5 shadow-2xl space-y-4">

                <button type="button" onClick={() => scrollTo('top')} className="text-left px-3 py-2 rounded-xl hover:bg-white/10 hover:text-white">

                </button>

                <button
                  type="button"
                  onClick={() => { setMobileMenuOpen(false); onExploreClick(); }}

                >
                  Explore destinations →
                </button>
              </div>
            </div>

      );
    }

    // --- Hero with Animated Background Image ---
    function Hero({ onExploreClick }) {
      return (
        <section
          id="top"
          className="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-stone-950 text-white"
        >
          {/* Animated Background Image Wrapper */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none">
            <img
              src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=2200&q=88"
              alt="Waterfall flowing through a lush green cave landscape"
              fetchPriority="high"
              className="absolute inset-0 w-full h-full object-cover object-center animate-hero-bg scale-105"
            />
          </div>

          {/* Dark Transparent Gradients for Pristine Text Readability */}
          <div className="absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-950/60 to-stone-950/45 pointer-events-none" />
          <div className="absolute inset-0 bg-gradient-to-r from-stone-950/75 via-transparent to-stone-950/75 pointer-events-none" />
          <div className="absolute -inset-1/3 hero-ambient-glow opacity-70" aria-hidden="true" />

          {/* Hero Content */}
          <div className="relative z-10 max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 text-center pt-28 pb-16 sm:py-36 flex flex-col items-center">
            {/* Eyebrow Pill */}
            <div className="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-emerald-300 text-xs sm:text-sm font-bold tracking-widest uppercase mb-6 shadow-sm">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              <span>DISCOVER · EXPLORE · RECONNECT</span>
            </div>

            {/* Main Headline */}
            <h1 className="text-4xl sm:text-6xl md:text-7xl font-extrabold text-white tracking-tight leading-[1.08] mb-6 max-w-4xl text-balance drop-shadow-md">
              Your next weekend adventure{' '}
              <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-teal-200 to-emerald-400">
                starts here.
              </span>
            </h1>

            {/* Description */}
            <p className="text-lg sm:text-xl md:text-2xl text-stone-200 leading-relaxed max-w-3xl mb-10 font-normal text-pretty">
              Discover beautiful destinations, hidden gems, and unforgettable experiences perfect for a short escape.
            </p>

            {/* Action Button */}
            <div className="mb-16 flex flex-col sm:flex-row items-center justify-center gap-4">
              <button
                type="button"
                onClick={onExploreClick}
                className="group inline-flex items-center justify-center gap-3 px-8 sm:px-10 py-4 sm:py-5 rounded-full text-base sm:text-lg font-bold text-stone-950 bg-emerald-400 hover:bg-emerald-300 transition-all duration-300 shadow-xl shadow-emerald-500/20 hover:shadow-2xl hover:scale-105 active:scale-98 cursor-pointer"
              >
                <span>Explore destinations →</span>
              </button>

              <a
                href="#about"
                className="inline-flex items-center justify-center px-6 py-4 rounded-full text-base font-semibold text-stone-200 hover:text-white hover:bg-white/10 transition-colors"
              >
                How it works ↓
              </a>
            </div>

            {/* Three Statistics */}
            <div className="grid grid-cols-3 gap-3 sm:gap-12 w-full max-w-2xl pt-8 border-t border-white/20">
              <div className="flex flex-col items-center">
                <span className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">50+</span>
                <span className="text-xs sm:text-sm font-medium text-stone-300 mt-1">destinations</span>
              </div>
              <div className="flex flex-col items-center border-x border-white/20 px-2">
                <span className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">2–3 day</span>
                <span className="text-xs sm:text-sm font-medium text-stone-300 mt-1">getaways</span>
              </div>
              <div className="flex flex-col items-center">
                <span className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">Curated</span>
                <span className="text-xs sm:text-sm font-medium text-stone-300 mt-1">for you</span>
              </div>
            </div>
          </div>

          {/* Floating Scroll Indicator */}
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 text-white/50 pointer-events-none">
            <span className="text-[10px] font-semibold tracking-wider uppercase">Scroll to explore</span>
            <svg className="w-4 h-4 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
            </svg>
          </div>
        </section>
      );
    }

    // --- FilterBar ---
    function FilterBar({ categories, activeCategory, onSelectCategory, categoryCounts }) {
      return (
        <div className="w-full flex flex-col items-center mb-10 text-center">
          <span className="text-xs font-bold uppercase tracking-widest text-emerald-800 bg-emerald-100/70 px-3 py-1 rounded-full mb-3">
            Curated Escapes
          </span>
          <h2 id="destinations-heading" className="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight mb-3">
            Perfect weekend escapes
          </h2>
          <p className="text-base sm:text-lg text-stone-700 max-w-xl mb-8">
            Choose a destination that matches your mood.
          </p>

          <div
            role="group"
            aria-label="Filter destinations by category"
            className="inline-flex flex-wrap items-center justify-center p-1.5 rounded-2xl bg-stone-100 border border-stone-200 gap-1"
          >
            {categories.map((category) => {
              const isSelected = activeCategory === category;
              const count = categoryCounts[category] || 0;
              return (
                <button
                  key={category}
                  type="button"
                  onClick={() => onSelectCategory(category)}
                  aria-pressed={isSelected}
                  className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all cursor-pointer ${
                    isSelected
                      ? 'bg-white text-emerald-800 shadow-md font-bold'
                      : 'text-stone-700 hover:text-stone-900 hover:bg-white/60'
                  }`}
                >
                  <span>{category}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ${isSelected ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-200 text-stone-700'}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // --- DestinationCard ---
    function DestinationCard({ destination, isSelected, onExplore }) {
      const categoryColors = {
        Beach: 'bg-cyan-50 text-cyan-800 border-cyan-200/80',
        Mountain: 'bg-emerald-50 text-emerald-800 border-emerald-200/80',
        Nature: 'bg-amber-50 text-amber-900 border-amber-200/80',
        City: 'bg-purple-50 text-purple-800 border-purple-200/80',
      };
      const badgeClass = categoryColors[destination.category] || 'bg-stone-50 text-stone-700 border-stone-200';

      return (
        <article className={`group relative flex flex-col bg-white rounded-3xl overflow-hidden border transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl ${
          isSelected ? 'border-emerald-600 ring-2 ring-emerald-600/30 shadow-md' : 'border-stone-200 shadow-sm'
        }`}>
          <div className="relative w-full aspect-[4/3] bg-stone-100 overflow-hidden">
            <img
              src={destination.image}
              alt={`${destination.name}, ${destination.location}`}
              loading="lazy"
              className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
            />
            <div className="absolute top-3.5 left-3.5">
              <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border backdrop-blur-md ${badgeClass}`}>
                {destination.category}
              </span>
            </div>
            {isSelected && (
              <div className="absolute top-3.5 right-3.5">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-md">
                  ✓ Selected
                </span>
              </div>
            )}
            <div className="absolute bottom-3 right-3.5">
              <div className="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white/95 backdrop-blur-md shadow-md text-xs font-bold text-stone-900">
                <span className="text-amber-500">★</span>
                <span>{destination.rating.toFixed(1)}</span>
              </div>
            </div>
          </div>

          <div className="flex flex-col flex-1 p-6">
            <div className="mb-2">
              <h3 className="text-xl font-bold text-stone-900 group-hover:text-emerald-700 transition-colors">
                {destination.name}
              </h3>
              <p className="text-xs font-medium text-stone-600 mt-0.5">
                📍 {destination.location}
              </p>
            </div>

            <p className="text-sm text-stone-700 leading-relaxed line-clamp-2 mb-6">
              “{destination.description}”
            </p>

            <div className="mt-auto pt-4 border-t border-stone-100 flex items-center justify-between gap-3">
              <div>
                <div className="text-base sm:text-lg font-extrabold text-stone-900">
                  ₹{destination.price.toLocaleString('en-IN')}{' '}
                  <span className="text-xs font-semibold text-stone-500">· {destination.duration}</span>
                </div>
              </div>

              <button
                type="button"
                onClick={() => onExplore(destination)}
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold text-emerald-800 bg-emerald-100/70 hover:bg-emerald-700 hover:text-white transition-all cursor-pointer active:scale-95"
              >
                <span>Explore →</span>
              </button>
            </div>
          </div>
        </article>
      );
    }

    // --- DestinationModal ---
    function DestinationModal({ destination, isOpen, isSelected, onClose, onSelectDestination }) {
      const closeRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        const originalOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        closeRef.current?.focus();

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalOverflow;
        };
      }, [isOpen, onClose]);

      if (!isOpen || !destination) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto" role="presentation">
          <div className="fixed inset-0 bg-stone-950/70 backdrop-blur-sm transition-opacity" onClick={onClose} />
          
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            className="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-stone-200 overflow-hidden z-10 my-8 animate-in fade-in zoom-in-95 duration-200"
          >
            <button
              ref={closeRef}
              type="button"
              onClick={onClose}
              aria-label="Close destination details"
              className="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-white/90 hover:bg-white text-stone-700 shadow flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
              ✕
            </button>

            <div className="relative w-full aspect-[16/9] bg-stone-100 overflow-hidden">
              <img src={destination.image} alt={destination.name} className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent" />
              <div className="absolute bottom-4 left-6 right-6 text-white">
                <span className="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-bold uppercase tracking-wider mb-2">
                  {destination.category}
                </span>
                <h3 id="modal-title" className="text-2xl sm:text-3xl font-extrabold">{destination.name}</h3>
                <p className="text-sm text-stone-200 mt-0.5">📍 {destination.location}</p>
              </div>
            </div>

            <div className="p-6 sm:p-8 space-y-6 max-h-[calc(85vh-200px)] overflow-y-auto">
              <div className="grid grid-cols-3 gap-3 p-4 rounded-2xl bg-stone-50 border border-stone-200 text-center">
                <div>
                  <div className="text-xs text-stone-500 font-medium">Rating</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">★ {destination.rating.toFixed(1)}</div>
                </div>
                <div className="border-x border-stone-200">
                  <div className="text-xs text-stone-500 font-medium">Price</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">₹{destination.price.toLocaleString('en-IN')}</div>
                </div>
                <div>
                  <div className="text-xs text-stone-500 font-medium">Duration</div>
                  <div className="text-stone-900 font-extrabold text-base mt-0.5">{destination.duration}</div>
                </div>
              </div>

              <div>
                <h4 className="text-sm font-bold uppercase tracking-wider text-stone-400 mb-2">Description</h4>
                <p className="text-stone-700 leading-relaxed text-sm sm:text-base">{destination.detailedDescription}</p>
              </div>

              <div>
                <h4 className="text-sm font-bold uppercase tracking-wider text-stone-400 mb-3">Highlights</h4>
                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  {destination.highlights.map((h, idx) => (
                    <li key={idx} className="flex items-center gap-2.5 text-sm font-medium text-stone-800 bg-emerald-50 border border-emerald-100 rounded-xl px-3.5 py-2">
                      <span className="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">✓</span>
                      <span>{h}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>

            <div className="p-6 bg-stone-50 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-xs text-stone-500 font-medium block">Starting from</span>
                <span className="text-2xl font-black text-stone-900">₹{destination.price.toLocaleString('en-IN')}</span>
                <span className="text-xs text-stone-500 ml-1">· {destination.duration}</span>
              </div>
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <button type="button" onClick={onClose} className="px-5 py-3 rounded-xl text-sm font-semibold text-stone-700 hover:bg-stone-200 cursor-pointer">
                  Close
                </button>
                <button
                  type="button"
                  onClick={() => onSelectDestination(destination)}
                  className={`inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-bold text-white shadow-lg cursor-pointer transition-colors active:scale-95 ${
                    isSelected ? 'bg-emerald-800' : 'bg-emerald-600 hover:bg-emerald-700'
                  }`}
                >
                  <span>{isSelected ? '✓ Selected' : 'Choose this destination'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main Application ---
    function App() {
      const [activeCategory, setActiveCategory] = useState('All');
      const [selectedDestination, setSelectedDestination] = useState(null);
      const [modalDestination, setModalDestination] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const closeModal = useCallback(() => setIsModalOpen(false), []);

      const filteredDestinations = useMemo(() => {
        if (activeCategory === 'All') return destinations;
        return destinations.filter((d) => d.category === activeCategory);
      }, [activeCategory]);

      const categoryCounts = useMemo(() => {
        const counts = { All: destinations.length, Beach: 0, Mountain: 0, Nature: 0, City: 0 };
        destinations.forEach((d) => { if (counts[d.category] !== undefined) counts[d.category] += 1; });
        return counts;
      }, []);

      const handleExploreClick = () => {
        const sec = document.getElementById('destinations');
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF8F5]">
          <Header onExploreClick={handleExploreClick} selectedCount={selectedDestination ? 1 : 0} />
          
          <main id="main-content" className="flex-1">
            <Hero onExploreClick={handleExploreClick} />

            <section id="why-us" className="py-12 bg-white border-y border-stone-200">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                <div className="flex items-start gap-4">
                  <div className="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold shrink-0">⏱️</div>
                  <div>
                    <h3 className="font-bold text-base text-stone-900">2 to 3 Day Itineraries</h3>
                    <p className="text-sm text-stone-600 mt-1">Carefully planned trips tailored for quick weekend turnarounds.</p>
                  </div>
                </div>
                <div className="flex items-start gap-4">
                  <div className="w-11 h-11 rounded-2xl bg-teal-100 text-teal-800 flex items-center justify-center font-bold shrink-0">🌿</div>
                  <div>
                    <h3 className="font-bold text-base text-stone-900">Curated & Tested</h3>
                    <p className="text-sm text-stone-600 mt-1">Verified homestays, authentic local food stops, and scenic trails.</p>
                  </div>
                </div>
                <div className="flex items-start gap-4">
                  <div className="w-11 h-11 rounded-2xl bg-amber-100 text-amber-900 flex items-center justify-center font-bold shrink-0">💰</div>
                  <div>
                    <h3 className="font-bold text-base text-stone-900">Budget Friendly</h3>
                    <p className="text-sm text-stone-600 mt-1">Transparent cost estimates covering stay, local food, and activities.</p>
                  </div>
                </div>
              </div>
            </section>

            <section id="destinations" className="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 scroll-mt-20">
              <FilterBar
                categories={CATEGORIES}
                activeCategory={activeCategory}
                onSelectCategory={setActiveCategory}
                categoryCounts={categoryCounts}
              />
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                {filteredDestinations.map((dest) => (
                  <DestinationCard
                    key={dest.id}
                    destination={dest}
                    isSelected={selectedDestination?.id === dest.id}
                    onExplore={(d) => { setModalDestination(d); setIsModalOpen(true); }}
                  />
                ))}
              </div>
            </section>

            <section id="about" className="py-20 bg-stone-100/70 border-t border-stone-200 text-center scroll-mt-18">
              <div className="max-w-4xl mx-auto px-4">
                <span className="text-xs font-bold uppercase tracking-widest text-emerald-800 bg-emerald-100 px-3.5 py-1 rounded-full mb-4 inline-block">
                  About Weekend Escape
                </span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-stone-900 mb-4">Reclaim your weekend.</h2>
                <p className="text-base sm:text-lg text-stone-700 max-w-2xl mx-auto mb-6">
                  Great travel shouldn't require taking two weeks off. With Weekend Escape, your next adventure is just a quick drive or train ride away.
                </p>
                <div className="inline-flex items-center gap-3 p-2 pr-6 rounded-full bg-white shadow-sm border border-stone-200 text-sm font-semibold text-stone-800">
                  <span className="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-xs">
                    WE
                  </span>
                  <span>Designed for spontaneous weekend travelers</span>
                </div>
              </div>
            </section>
          </main>

          <footer className="w-full bg-stone-900 text-stone-300 py-12 border-t border-stone-800 text-center">
            <p className="font-bold text-white text-lg">Weekend Escape</p>
            <p className="text-xs text-stone-400 mt-2">© {new Date().getFullYear()} Weekend Escape. All rights reserved.</p>
          </footer>

          <DestinationModal
            destination={modalDestination}
            isOpen={isModalOpen}
            isSelected={modalDestination?.id === selectedDestination?.id}
            onClose={closeModal}
            onSelectDestination={(d) => { setSelectedDestination(d); setIsModalOpen(false); }}
          />

          {selectedDestination && (
            <aside className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-lg animate-in slide-in-from-bottom-4 duration-200">
              <div role="status" aria-live="polite" className="flex items-center justify-between gap-4 p-4 rounded-2xl bg-stone-900 text-white shadow-2xl border border-stone-800">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold">✓</div>
                  <div>
                    <div className="text-sm font-bold">✓ {selectedDestination.name} selected!</div>
                    <div className="text-xs text-stone-400">{selectedDestination.duration} getaway in {selectedDestination.location}</div>
                  </div>
                </div>
                <button type="button" onClick={() => setSelectedDestination(null)} className="p-1 text-stone-400 hover:text-white cursor-pointer" aria-label="Dismiss">✕</button>
              </div>
            </aside>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
